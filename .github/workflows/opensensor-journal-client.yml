name: OpenSensor journal client validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opensensor-journal-client-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting and validate the ES8 client
        run: |
          ./gradlew --no-daemon --max-workers=2 :conductor-es8-persistence:spotlessCheck :conductor-es8-persistence:test
      - name: Build server artifact only
        run: |
          ./gradlew --no-daemon --max-workers=2 :conductor-server:bootJar -PindexingBackend=elasticsearch8
      - name: Save test reports and server JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensensor-journal-client-${{ github.sha }}
          if-no-files-found: warn
          path: |
            es8-persistence/build/reports/tests/
            es8-persistence/build/test-results/test/
            server/build/libs/*boot*.jar
